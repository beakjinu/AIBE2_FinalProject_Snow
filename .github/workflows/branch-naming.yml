name: Branch Naming Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "🔍 브랜치 이름 확인: $BRANCH_NAME"
          
          # 허용되는 패턴: feature/, fix/, hotfix/, refactor/, docs/, test/, chore/
          if [[ $BRANCH_NAME =~ ^(feature|fix|hotfix|refactor|docs|test|chore)/.+ ]]; then
            echo "✅ 브랜치 이름이 규칙에 맞습니다!"
            exit 0
          else
            echo "❌ 브랜치 이름이 규칙에 맞지 않습니다!"
            echo ""
            echo "📋 올바른 형식:"
            echo "  - feature/기능명"
            echo "  - fix/버그명"
            echo "  - hotfix/긴급수정"
            echo "  - refactor/설명"
            echo "  - docs/문서작업"
            echo "  - test/테스트"
            echo "  - chore/설정작업"
            echo ""
            echo "예시: feature/user-login, fix/navbar-bug"
            exit 1
          fi